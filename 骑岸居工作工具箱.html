<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑岸居 · 工作工具箱</title>
<style>
*{box-sizing:border-box}
:root{--line:#e2e8f0;--muted:#64748b;--brand:#2563eb}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f4f6f9;color:#1e293b;line-height:1.6;padding:0 0 48px}
header{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;padding:22px 20px 26px;box-shadow:0 2px 12px rgba(30,64,175,.18)}
header .wrap{max-width:1000px;margin:0 auto}
.tabs-wrap{max-width:1000px;margin:16px auto 0;padding:0 20px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.05);overflow:hidden}
.tabs-wrap .ant-tabs-nav{margin-bottom:0;padding:0 12px}
main{max-width:1000px;margin:16px auto 0;padding:0 20px}
.hidden{display:none}
.card{margin-bottom:14px}
.card .sec-num{margin:0;font-weight:700}
.field,.mini{min-width:0;flex:1}
.field-label,.mini-label{display:block;font-size:12px;margin-bottom:5px;font-weight:600}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.group{background:#f8fafc}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zone{position:relative;overflow:hidden;min-height:116px;border:2px dashed #cbd5e1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s;background:#fff;text-align:center;padding:12px}
.zone input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.zone .up-icon{width:28px;height:28px;margin-bottom:6px}
.zone.has .up-icon{display:none}
.zone:hover,.zone.over{border-color:#2563eb;background:#eff6ff}
.zone.has{border-style:solid;border-color:#93c5fd;background:#f0f7ff}
.zone .thumbstrip{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap;justify-content:center}
.zone .thumbstrip img{width:34px;height:34px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.entry{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.grid2,.grid3,.grid4{display:grid;gap:10px}
.grid2{grid-template-columns:1fr 1fr}
.grid3{grid-template-columns:repeat(3,1fr)}
.grid4{grid-template-columns:repeat(4,1fr)}
.issue{display:grid;grid-template-columns:88px 88px 1fr;gap:14px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.issue:first-child{border-top:0}
.thumb{position:relative}
.thumb img{width:100%;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#e2e8f0}
.thumb .tag{position:absolute;bottom:3px;left:3px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;padding:1px 5px;border-radius:3px}
.count{font-size:13px;color:var(--muted);margin:12px 0 4px}
.tip{margin-top:12px}
.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.status-tag{margin:0}
.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:26px}
@media(max-width:720px){.zones{grid-template-columns:1fr}.grid3,.grid4{grid-template-columns:1fr 1fr}.issue{grid-template-columns:64px 64px 1fr;gap:8px}.thumb img{height:58px}}

</style>
</head>
<body>
<div id="root"></div>

<script>
/* ==== 生成核心（交办单 / xlsx / docx） ==== */


const CN = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];
// 页面 25.4 x 19.05 cm；照片区放大到约 11.3cm 高，标签下方到页脚上方
const IMG_BOXES = [
  [360000, 2300000, 4060000, 4070000],
  [4752000, 2300000, 4060000, 4070000]
];
const RIGHT_X = 6000000;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function ab64(buf){
  const bytes = new Uint8Array(buf); let s = '';
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk) s += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  return btoa(s);
}

function fitBox(pw, ph, box){
  const [bx,by,bw,bh] = box;
  if(pw<=0||ph<=0) return [bx,by,bw,bh];
  const ratio = pw/ph, boxRatio = bw/bh;
  let w,h;
  if(ratio>=boxRatio){ w=bw; h=Math.round(bw/ratio); }
  else { h=bh; w=Math.round(bh*ratio); }
  return [Math.round(bx+(bw-w)/2), Math.round(by+(bh-h)/2), w, h];
}

function setProblemText(xml, text){
  const re = /<p:sp>(?:(?!<\/p:sp>)[\s\S])*?sz="4000"(?:(?!<\/p:sp>)[\s\S])*?<\/p:sp>/;
  const m = xml.match(re);
  if(!m) return xml;
  let seg = m[0];
  const rm = seg.match(/<a:rPr[^>]*>[\s\S]*?<\/a:rPr>|<a:rPr[^>]*\/>/);
  const rpr = rm ? rm[0] : '<a:rPr lang="zh-CN" sz="4000"/>';
  seg = seg.replace(/<a:r>[\s\S]*?<\/a:r>/g,'');
  seg = seg.replace('</a:p>', `<a:r>${rpr}<a:t>${esc(text)}</a:t></a:r></a:p>`);
  const xf = seg.match(/<a:off x="(\d+)" y="(\d+)"\/>\s*<a:ext cx="(\d+)" cy="(\d+)"\/>/);
  if(xf){
    const x=+xf[1], y=+xf[2], cy=xf[4];
    const want = Math.max(+xf[3], RIGHT_X - x - 91440);
    seg = seg.replace(xf[0], `<a:off x="${x}" y="${y}"/><a:ext cx="${want}" cy="${cy}"/>`);
  }
  seg = seg.replace(/<a:bodyPr([^>]*?)\s*\/>/, '<a:bodyPr$1><a:normAutofit/></a:bodyPr>');
  xml = xml.replace(m[0], seg);
  const re2 = /<p:sp>(?:(?!<\/p:sp>)[\s\S])*?sz="(?:2000|2800)"(?:(?!<\/p:sp>)[\s\S])*?<\/p:sp>/g;
  xml = xml.replace(re2, s2 => {
    const txt = [...s2.matchAll(/<a:t>(.*?)<\/a:t>/g)].map(t=>t[1]).join('').trim();
    return (!txt || txt.includes('整改')) ? s2 : s2.replace(/<a:r>[\s\S]*?<\/a:r>/g,'');
  });
  return xml;
}

// 把「整改前/整改后」标签移到各自照片框正上方
function centerLabels(xml){
  for(const [txt,box] of [['整改前',IMG_BOXES[0]],['整改后',IMG_BOXES[1]]]){
    const re = new RegExp('<p:sp>(?:(?!<\\/p:sp>)[\\s\\S])*?'+txt+'(?:(?!<\\/p:sp>)[\\s\\S])*?<\\/p:sp>');
    xml = xml.replace(re, seg => {
      const cx = box[0] + box[2]/2;
      const m = seg.match(/<a:off x="(-?\d+)" y="(-?\d+)"\/>/);
      if(m){
        const nx = Math.round(cx - 685800);
        seg = seg.replace(m[0], `<a:off x="${nx}" y="${m[2]}"/>`);
      }
      return seg;
    });
  }
  return xml;
}

function applyPics(xml, imgs){
  const ms = [...xml.matchAll(/<p:pic>[\s\S]*?<\/p:pic>/g)];
  ms.sort((a,b)=>{
    const x = m => +((m[0].match(/<a:off x="(-?\d+)"/)||[])[1]||0);
    return x(a)-x(b);
  });
  let out = xml;
  for(let k=0;k<2 && k<ms.length;k++){
    const old = ms[k][0]; let seg = old;
    const im = imgs[k];
    seg = seg.replace(/r:embed="[^"]*"/, `r:embed="rIdImg${k+1}"`);
    seg = seg.replace(/<a:off x="-?\d+" y="-?\d+"\/>/, `<a:off x="${im[0]}" y="${im[1]}"/>`);
    seg = seg.replace(/<a:ext cx="\d+" cy="\d+"\/>/, `<a:ext cx="${im[2]}" cy="${im[3]}"/>`);
    if(old !== seg) out = out.replace(old, seg);
  }
  return out;
}

function setRels(rels, i){
  rels = rels.replace(/<Relationship\b[^>]*Type="[^"]*\/image"[^>]*\/>/g,'');
  const t = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/image';
  const a = `../media/jbd_${2*i+1}.jpg`, b = `../media/jbd_${2*i+2}.jpg`;
  return rels.replace('</Relationships>',
    `<Relationship Id="rIdImg1" Type="${t}" Target="${a}"/>`+
    `<Relationship Id="rIdImg2" Type="${t}" Target="${b}"/>`+
    '</Relationships>');
}

async function cloneSlide(zip, idx){
  let pres = await zip.file('ppt/presentation.xml').async('string');
  let prels = await zip.file('ppt/_rels/presentation.xml.rels').async('string');
  const ids = [...pres.matchAll(/<p:sldId id="(\d+)"/g)].map(m=>+m[1]);
  const newId = Math.max(...ids)+1;
  const rids = [...prels.matchAll(/Id="(rId\d+)"/g)].map(m=>m[1]);
  let k=1; while(rids.includes('rId'+k)) k++;
  const newRid = 'rId'+k;
  pres = pres.replace('</p:sldIdLst>', `<p:sldId id="${newId}" r:id="${newRid}"/></p:sldIdLst>`);
  prels = prels.replace('</Relationships>',
    `<Relationship Id="${newRid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide${idx}.xml"/></Relationships>`);
  zip.file('ppt/presentation.xml', pres);
  zip.file('ppt/_rels/presentation.xml.rels', prels);
  let ct = await zip.file('[Content_Types].xml').async('string');
  ct = ct.replace('</Types>',
    `<Override PartName="/ppt/slides/slide${idx}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/></Types>`);
  zip.file('[Content_Types].xml', ct);
}

function setCoverDate(xml, y, m, d){
  const ts = [...xml.matchAll(/<a:t>(.*?)<\/a:t>/g)];
  const rep = {2:String(y), 4:String(m), 6:String(d)};
  let out = xml;
  for(let i=ts.length-1;i>=0;i--) if(i in rep) out = out.replace(ts[i][0], `<a:t>${rep[i]}</a:t>`);
  return out;
}

async function imageSize(file){
  if(file && file.__w && file.__h) return [file.__w, file.__h];
  const bmp = await createImageBitmap(file);
  const r = [bmp.width, bmp.height];
  bmp.close && bmp.close();
  return r;
}

// pairs: [{before:File, after:File, desc:String}]
// meta:  {date:'YYYY-MM-DD', title:'骑岸居'}
async function generatePPT(pairs, meta, opt){
  opt = opt || {};
  if(!pairs.length) throw new Error('没有可生成的照片组');
  const [ys,ms,ds] = String(meta.date||'').split('-').map(Number);
  if(!ys||!ms||!ds) throw new Error('请选择交办日期');
  const title = (meta.title||'骑岸居').trim() || '骑岸居';
  const zip = await JSZip.loadAsync(TEMPLATE_B64, {base64:true});

  let s2 = await zip.file('ppt/slides/slide2.xml').async('string');
  zip.file('ppt/slides/slide2.xml', setCoverDate(s2, ys, ms, ds));
  let s1 = await zip.file('ppt/slides/slide1.xml').async('string');
  zip.file('ppt/slides/slide1.xml', s1.replace(/骑岸居/g, esc(title)));

  const baseXml = await zip.file('ppt/slides/slide3.xml').async('string');
  const baseRels = await zip.file('ppt/slides/_rels/slide3.xml.rels').async('string');
  const withLabels = centerLabels(baseXml);

  for(let i=0;i<pairs.length;i++){
    const idx = 3+i;
    if(idx>3) await cloneSlide(zip, idx);
    let xml = withLabels;
    xml = setProblemText(xml, `问题${CN[i]||(i+1)}：${pairs[i].desc||'路边垃圾'}`);

    const imgs = [];
    for(const [file,box] of [[pairs[i].before,IMG_BOXES[0]],[pairs[i].after,IMG_BOXES[1]]]){
      const [pw,ph] = await imageSize(file);
      imgs.push(fitBox(pw,ph,box));
    }
    xml = applyPics(xml, imgs);

    for(const [file,k] of [[pairs[i].before,1],[pairs[i].after,2]]){
      const b64 = ab64(await file.arrayBuffer());
      zip.file(`ppt/media/jbd_${2*i+k}.jpg`, b64, {base64:true});
    }
    zip.file(`ppt/slides/slide${idx}.xml`, xml);
    zip.file(`ppt/slides/_rels/slide${idx}.xml.rels`, setRels(baseRels, i));
    if(opt.onProgress) opt.onProgress(i+1, pairs.length);
    if(typeof setTimeout === 'function') await new Promise(r=>setTimeout(r,0));
  }
  return await zip.generateAsync({
    type: opt.type || 'blob',
    compression: 'DEFLATE',
    compressionOptions: {level:6}
  });
}


/* ==== 共用：前端生成 xlsx / docx（纯 JSZip，无外部模板） ==== */

function xmlEsc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function colName(n){
  let s=''; n = n|0;
  while(n>0){ n--; s = String.fromCharCode(65 + n%26) + s; n = Math.floor(n/26); }
  return s;
}

/* ---------- 简易 XLSX（inlineStr，多 sheet，含基础样式） ---------- */
async function buildXlsx(sheets, opt){
  opt = opt || {};
  const files = {};
  const T = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const ctTypes = [
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>',
    '<Default Extension="xml" ContentType="application/xml"/>',
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>',
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
  ];
  sheets.forEach((s,i)=>ctTypes.push(`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`));
  files['[Content_Types].xml'] = T + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">${ctTypes.join('')}</Types>`;
  files['_rels/.rels'] = T + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';

  const wbSheets = sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name.replace(/[\\/?*\[\]:]/g,'_').slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('');
  files['xl/workbook.xml'] = T + `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${wbSheets}</sheets></workbook>`;
  files['xl/_rels/workbook.xml.rels'] = T + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('') +
    `<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>` +
    '</Relationships>';

  files['xl/styles.xml'] = T + `<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
    <fonts count="3"><font><sz val="11"/><name val="宋体"/></font><font><b/><sz val="14"/><name val="宋体"/></font><font><b/><sz val="11"/><name val="宋体"/></font></fonts>
    <fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8EEF7"/><bgColor indexed="64"/></patternFill></fill></fills>
    <borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FF808080"/></left><right style="thin"><color rgb="FF808080"/></right><top style="thin"><color rgb="FF808080"/></top><bottom style="thin"><color rgb="FF808080"/></bottom><diagonal/></border></borders>
    <cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
    <cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
    <cellXfs count="4">
      <xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
      <xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
      <xf numFmtId="0" fontId="2" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>
      <xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>
    </cellXfs>
  </styleSheet>`;

  sheets.forEach((sh,si)=>{
    const rows = sh.rows || [];
    const widths = sh.widths || [];
    const cols = widths.length ? `<cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
    let body = '';
    rows.forEach((row,ri)=>{
      let cells = '';
      const arr = Array.isArray(row) ? row : [];
      arr.forEach((val,ci)=>{
        if(val == null || val === '') return;
        const ref = colName(ci+1) + (ri+1);
        let style = 3;
        if(sh.titleRow === ri) style = 1;
        else if(sh.headerRow === ri) style = 2;
        const isNum = typeof val === 'number' && isFinite(val);
        cells += isNum
          ? `<c r="${ref}" s="${style}"><v>${val}</v></c>`
          : `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(val)}</t></is></c>`;
      });
      const h = (sh.rowHeights && sh.rowHeights[ri]) ? ` ht="${sh.rowHeights[ri]}" customHeight="1"` : '';
      body += `<row r="${ri+1}"${h}>${cells}</row>`;
    });
    const merge = (sh.merges||[]).map(m=>`<mergeCell ref="${m}"/>`).join('');
    files[`xl/worksheets/sheet${si+1}.xml`] = T + `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${body}</sheetData>${merge ? `<mergeCells count="${(sh.merges||[]).length}">${merge}</mergeCells>` : ''}</worksheet>`;
  });

  const zip = new JSZip();
  Object.keys(files).forEach(k => zip.file(k, files[k]));
  return await zip.generateAsync({type: opt.type || 'blob', compression:'DEFLATE', compressionOptions:{level:6}});
}

/* ---------- 简易 DOCX（含嵌入照片） ---------- */
async function buildDocx(blocks, opt){
  opt = opt || {};
  const T = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  const media = [];
  let body = '';

  function para(text, o){
    o = o || {};
    const align = o.align ? `<w:jc w:val="${o.align}"/>` : '';
    const bold = o.bold ? '<w:b/>' : '';
    const sz = o.size ? `<w:sz w:val="${o.size*2}"/><w:szCs w:val="${o.size*2}"/>` : '';
    const before = o.before != null ? `<w:spacing w:before="${o.before}"/>` : '';
    return `<w:p><w:pPr>${align}${before}</w:pPr><w:r><w:rPr>${bold}${sz}<w:rFonts w:eastAsia="宋体" w:ascii="宋体"/></w:rPr><w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p>`;
  }
  function table(rows, widths){
    let xml = '<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders>' +
      ['top','left','bottom','right','insideH','insideV'].map(k=>`<w:${k} w:val="single" w:sz="4" w:color="808080"/>`).join('') +
      '</w:tblBorders></w:tblPr><w:tblGrid>' +
      (widths||rows[0].map(()=>2400)).map(w=>`<w:gridCol w:w="${w}"/>`).join('') + '</w:tblGrid>';
    rows.forEach((row,ri)=>{
      xml += '<w:tr>';
      row.forEach(cell=>{
        const txt = String(cell == null ? '' : cell).replace(/\n/g,' ');
        xml += `<w:tc><w:tcPr><w:tcW w:w="2400" w:type="dxa"/></w:tcPr><w:p><w:pPr><w:jc w:val="left"/></w:pPr><w:r><w:rPr><w:rFonts w:eastAsia="宋体"/></w:rPr><w:t xml:space="preserve">${xmlEsc(txt)}</w:t></w:r></w:p></w:tc>`;
      });
      xml += '</w:tr>';
    });
    return xml + '</w:tbl>';
  }
  function picture(file, maxW){
    return new Promise(async resolve=>{
      try{
        const dataUrl = await fileToDataUrl(file, maxW || 900);
        const b64 = dataUrl.split(',')[1];
        const name = 'img' + (media.length+1) + '.jpeg';
        media.push({name, b64});
        const id = media.length;
        const cx = 360000 * 12, cy = 360000 * 7;
        resolve(`<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="Picture ${id}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="${name}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdImg${id}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`);
      }catch(e){ resolve(para('[照片读取失败: '+(e.message||e)+']')); }
    });
  }

  for(const b of blocks){
    if(b.t === 'p') body += para(b.text, b);
    else if(b.t === 'table') body += table(b.rows, b.widths);
    else if(b.t === 'img') body += await picture(b.file, b.maxW);
    else if(b.t === 'page') body += '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
    else if(b.t === 'space') body += para('', {before: b.h || 120});
  }

  const doc = T + `<w:document ${NS} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1200" w:right="1000" w:bottom="1200" w:left="1000"/></w:sectPr></w:body></w:document>`;

  const zip = new JSZip();
  zip.file('[Content_Types].xml', T + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  zip.file('_rels/.rels', T + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/document.xml', doc);
  let rels = '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  media.forEach((m,i)=>{ rels += `<Relationship Id="rIdImg${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name}"/>`; });
  zip.file('word/_rels/document.xml.rels', T + rels + '</Relationships>');
  media.forEach(m => zip.file('word/media/'+m.name, m.b64, {base64:true}));
  return await zip.generateAsync({type: opt.type || 'blob', compression:'DEFLATE', compressionOptions:{level:6}});
}

/* 照片压缩为 JPEG dataURL（浏览器 Canvas） */
function fileToDataUrl(file, maxW){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      try{
        const scale = Math.min(1, (maxW||900)/img.width);
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width*scale));
        c.height = Math.max(1, Math.round(img.height*scale));
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img,0,0,c.width,c.height);
        const out = c.toDataURL('image/jpeg', 0.78);
        URL.revokeObjectURL(url);
        resolve(out);
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('照片读取失败')); };
    img.src = url;
  });
}

function downloadBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 30000);
}

function todayStr(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
